name: Bandit Security Scan

on: 
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  bandit:
    name: Ejecutar Análisis de Bandit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Ejecutar Bandit Scan
        # -r busca de forma recursiva en el directorio actual
        # -ll filtra para mostrar solo advertencias de severidad media y alta
        run: bandit -r . -ll
        continue-on-error: true # Evita que el workflow falle por completo si encuentra vulnerabilidades
